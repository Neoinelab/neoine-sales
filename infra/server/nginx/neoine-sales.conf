# /etc/nginx/conf.d/neoine-sales.conf (bootstrap.sh가 설치). server_name과 인증서 경로는 서버에 맞게 바꾼다.
server {
    listen 80;
    server_name sales.internal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sales.internal.example.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 프런트엔드 정적 파일. current 링크를 통해 서빙하므로 배포 때 Nginx 재시작이 필요 없다
    root /opt/neoine-sales/current/frontend/dist;

    location / {                         # SPA 라우팅
        try_files $uri /index.html;
    }
    location /assets/ {                  # 해시 파일명: 장기 캐시
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /config.json {            # 프로파일별 런타임 설정(릴리스와 무관)
        alias /opt/neoine-sales/shared/config.json;
        add_header Cache-Control "no-cache";
    }

    # 백엔드 API와 상태 확인(로드밸런서·가동 감시용)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8000; }
    location = /readyz  { proxy_pass http://127.0.0.1:8000; }
}

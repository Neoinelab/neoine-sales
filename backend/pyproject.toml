[project]
name = "neoine-sales-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dennis Kim", email = "dgkim11@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "ldap3>=2.9.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle, pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM",           # simplify
  "C4",            # comprehensions
  "ANN",           # 타입 힌트 강제
  "S",             # bandit 보안
  "RUF", "PL",     # ruff 고유, pylint 일부
  "ASYNC", "PT", "TC",
  "C90",           # 순환 복잡도
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 30

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy는 Mapped[...] 타입을 런타임에 해석하므로 ORM 클래스가 쓰는 import는 옮기지 않는다
runtime-evaluated-base-classes = [
  "app.infra.db.base.Base", "app.infra.db.models.AuditColumns", "pydantic.BaseModel",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# FastAPI는 라우터 함수의 타입 힌트를 런타임에 해석하므로 import를 TYPE_CHECKING으로 옮기지 않는다
"src/app/web/**" = ["TC001", "TC002", "TC003"]
"alembic/versions/*" = [  # 자동 생성 마이그레이션: 생성 형식(Union 등)과 긴 줄을 그대로 둔다
  "E501", "ANN", "D", "N999", "RUF012", "I001", "UP006", "UP007", "UP035", "TC",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.14"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ldap3", "ldap3.*"]
ignore_missing_imports = true  # ldap3는 타입 스텁이 없다(types-ldap3는 추가하지 않기로 함)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = [
  "integration: 실제 PostgreSQL 임시 DB가 필요한 테스트 (빠른 단위 테스트만: -m 'not integration')",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "계층 의존성: web, infra → application → domain"
type = "layers"
layers = ["app.web | app.infra", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "domain은 순수해야 한다"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "httpx", "redis"]

[[tool.importlinter.contracts]]
name = "application은 구체 기술을 몰라야 한다"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "redis"]
